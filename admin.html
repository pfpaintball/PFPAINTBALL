<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin - PF Paintball</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white min-h-screen p-4">
<div id="login" class="max-w-sm mx-auto mt-24 space-y-3">
  <h1 class="text-2xl font-black text-lime-400">PF PAINTBALL · Admin</h1>
  <input id="em" type="email" placeholder="Correo" autocomplete="username" class="w-full p-3 rounded bg-slate-800">
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" class="w-full p-3 rounded bg-slate-800">
  <button id="go" class="w-full p-3 rounded bg-lime-400 text-black font-bold">Entrar</button>
  <p id="err" class="text-pink-400 text-sm"></p>
</div>
<div id="panel" class="hidden max-w-5xl mx-auto">
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <h1 class="text-xl font-black text-lime-400 mr-auto">Reservaciones</h1>
    <select id="flt" class="p-2 rounded bg-slate-800 text-sm"><option value="">Todas</option><option>pendiente</option><option>confirmada</option><option>cancelada</option></select>
    <button id="csv" class="px-3 py-2 rounded bg-cyan-400 text-black text-sm font-bold">Descargar CSV</button>
    <button id="out" class="px-3 py-2 rounded bg-slate-700 text-sm">Salir</button>
  </div>
  <div id="list" class="space-y-3"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";
import { firebaseConfig, recaptchaSiteKey } from "./firebase-config.js";
const app = initializeApp(firebaseConfig);
if (recaptchaSiteKey) initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider(recaptchaSiteKey), isTokenAutoRefreshEnabled: true });
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slot = r => `${r.fecha}_${r.hora.replace(/[: ]/g, '')}`;
let R = [], unsub = null;

$('go').onclick = async () => {
  $('err').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('em').value, $('pw').value); }
  catch { $('err').textContent = 'Correo o contraseña incorrectos.'; }
};
$('out').onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  $('login').classList.toggle('hidden', !!u); $('panel').classList.toggle('hidden', !u);
  if (unsub) { unsub(); unsub = null; }
  if (u) unsub = onSnapshot(query(collection(db, 'reservas'), orderBy('fecha')),
    s => { R = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora)); draw(); },
    () => { alert('Esta cuenta no tiene permiso de administrador.'); signOut(auth); });
});

function draw() {
  const f = $('flt').value, col = { pendiente: 'text-yellow-300', confirmada: 'text-lime-400', cancelada: 'text-pink-400' };
  $('list').innerHTML = R.map((r, i) => !f || r.estado === f ? `
    <div class="bg-slate-900 border border-white/10 rounded-xl p-4 flex flex-wrap gap-3 items-center justify-between">
      <div class="text-sm"><b class="text-lime-400">${esc(r.codigo)}</b> <span class="${col[r.estado] || ''} text-xs uppercase font-bold">${esc(r.estado)}</span>
        <div class="text-base font-bold">${esc(r.nombre)}</div>
        <div class="text-gray-400">${esc(r.fecha)} · ${esc(r.hora)} · ${esc(r.jugadores)} jugadores · ${esc(r.paquete)} · $${esc(r.total)} USD</div>
        <div class="text-gray-400">${esc(r.telefono)} · ${esc(r.email)}</div></div>
      <div class="flex flex-wrap gap-2 text-xs font-bold">
        <button data-a="ok" data-i="${i}" class="px-3 py-2 rounded bg-lime-400 text-black">Confirmar</button>
        <button data-a="wa" data-i="${i}" class="px-3 py-2 rounded bg-green-500 text-black">WhatsApp</button>
        <button data-a="no" data-i="${i}" class="px-3 py-2 rounded bg-yellow-400 text-black">Cancelar</button>
        <button data-a="del" data-i="${i}" class="px-3 py-2 rounded bg-pink-500">Eliminar</button>
      </div></div>` : '').join('') || '<p class="text-gray-500">Sin reservaciones.</p>';
}
$('flt').onchange = draw;

$('list').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const r = R[b.dataset.i], ref = doc(db, 'reservas', r.id);
  try {
    if (b.dataset.a === 'ok') await updateDoc(ref, { estado: 'confirmada' });
    if (b.dataset.a === 'wa') {
      let n = r.telefono.replace(/\D/g, ''); if (n.length === 10) n = '1' + n;
      const t = `Hola ${r.nombre}, tu reserva en PF Paintball (${r.codigo}) para el ${r.fecha} a las ${r.hora}, ${r.jugadores} jugadores, paquete ${r.paquete}, total $${r.total} USD, está CONFIRMADA. ¡Te esperamos en El Cercadillo, La Sabana, Yamasá!`;
      window.open(`https://wa.me/${n}?text=${encodeURIComponent(t)}`, '_blank', 'noopener');
    }
    if (b.dataset.a === 'no' && confirm('¿Cancelar esta reserva y liberar el horario?')) {
      const w = writeBatch(db); w.update(ref, { estado: 'cancelada' }); w.delete(doc(db, 'disponibilidad', slot(r))); await w.commit();
    }
    if (b.dataset.a === 'del' && confirm('¿Eliminar definitivamente esta reserva y sus datos?')) {
      const w = writeBatch(db); w.delete(ref); w.delete(doc(db, 'disponibilidad', slot(r))); await w.commit();
    }
  } catch (err) { alert('Error: ' + err.code); }
};

$('csv').onclick = () => {
  const k = ['codigo','nombre','telefono','email','fecha','hora','jugadores','paquete','total','estado'];
  const c = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const t = '\ufeff' + [k.join(','), ...R.map(r => k.map(x => c(r[x])).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' }));
  a.download = 'reservaciones.csv'; a.click();
};
</script></body></html>
